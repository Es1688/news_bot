# Шаблон для VPS: подстановки __BOT_IMAGE__ и __APP_DIR__ (см. .github/workflows/docker.yml).

services:
  newsbot:
    image: __BOT_IMAGE__
    container_name: newsbot
    restart: unless-stopped
    env_file:
      - __APP_DIR__/.env
    environment:
      DATABASE_PATH: /app/data/news_bot.db
    volumes:
      - __APP_DIR__/data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/news_bot/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - newsbot-net

networks:
  newsbot-net:
    driver: bridge
