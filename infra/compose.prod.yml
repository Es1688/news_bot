# Локально из корня репозитория:
# docker compose -p newsbot -f infra/compose.prod.yml up -d --build
# (имена контейнеров совпадают с VPS, см. infra/compose.prod.vps.yml).

services:
  newsbot:
    image: eshim88/content-fabric-newsbot:latest
    build:
      context: ..
      dockerfile: news_bot/Dockerfile
    container_name: newsbot
    env_file:
      - ../news_bot/.env
    environment:
      DATABASE_PATH: /app/data/news_bot.db
    volumes:
      - ../news_bot/data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sqlite3,time,pathlib; path='data/news_bot.db'; interval=int(os.getenv('POST_INTERVAL_HOURS','6')); allowed=interval*7200; db=pathlib.Path(path); ok=lambda: (_ for _ in ()).throw(SystemExit(0)); fail=lambda: (_ for _ in ()).throw(SystemExit(1)); if not db.exists(): ok(); conn=sqlite3.connect(path); row=conn.execute(\\\"SELECT strftime('%s', MAX(created_at)) FROM bot_stats WHERE event='run'\\\").fetchone(); conn.close(); if not row or not row[0]: ok(); ts=int(row[0]); now=int(time.time()); ok() if now - ts < allowed else fail()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - newsbot-net

networks:
  newsbot-net:
    driver: bridge
