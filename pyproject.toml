[project]
name = "news-bot"
version = "0.1.0"
description = "Telegram bot: RSS news gathering, keyword filtering, dedup, channel publishing"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28,<4",
    "aiohttp>=3.13,<4",
    "feedparser>=6.0,<7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not integration"'
markers = ["integration: tests that require internet access"]
